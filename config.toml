# Hungarian vocab trainer configuration.
# Secrets (API keys, SMTP, Telegram) come from environment variables — see .env.example.

[general]
# Public URL of the GitHub Pages site (used in emails and the podcast feed).
site_url = "https://emmascully.github.io/hungarian-vocab/"
data_dir = "data"
build_dir = "build"

[generator]
n_words = 20
# Max share of each list taken from the "needs practice / failed / untested" bank.
review_ratio = 0.5
# Default topics when none are passed on the command line. Empty = high-frequency everyday words.
topics = []
level = "beginner to lower-intermediate (CEFR A1–B1)"

[llm]
provider = "gemini"          # gemini (free tier, GEMINI_API_KEY) | claude (ANTHROPIC_API_KEY)
model = "gemini-3.8-flash"   # for claude use e.g. "claude-opus-5-5"
# Tried in order if the main model is overloaded (503) or rate-limited (429). Gemini only.
fallback_models = ["gemini-3.7-flash", "gemini-3.5-flash"]
effort = "low"               # claude only

[audio]
provider = "edge"            # edge (free, no key) | azure (free F0 tier, needs AZURE_SPEECH_KEY/REGION)
voice_en = "en-GB-SoniaNeural"
voice_hu = "hu-HU-NoemiNeural"
pause_after_en = 1.5         # seconds
pause_after_hu = 3.0
repeat_hu_slow = true        # say the Hungarian a second time, slower
slow_rate = "-30%"

[notify]
email = true
telegram = false           # enable once TELEGRAM_BOT_TOKEN/CHAT_ID secrets exist
