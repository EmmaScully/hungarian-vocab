name: Rebuild audio

# Re-create the mp3 for an existing list (e.g. after changing voices or pauses in config.toml)
# without generating new words. Replaces the file on that week's GitHub Release.
on:
  workflow_dispatch:
    inputs:
      list_id:
        description: "List to rebuild, e.g. 2026-W40 (blank = latest)"
        required: false

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - name: Rebuild audio, release and feed
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIST_ID: ${{ inputs.list_id }}
        run: |
          args=()
          if [ -n "$LIST_ID" ]; then args+=(--list-id "$LIST_ID"); fi
          uv run vocab audio "${args[@]}"
          uv run vocab release "${args[@]}"
          uv run vocab feed
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild audio"
          git pull --rebase
          git push

  deploy:
    needs: build
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
