name: Weekly word list

# Normally run by hand after the Monday lesson (Actions -> Weekly word list -> Run workflow),
# pasting the lesson chat into "lesson_notes". The schedule is only a fallback: if no list
# exists for the week by 21:00 Monday Melbourne time, a default list is generated.
# GitHub cron is UTC-only and can delay or drop runs, so there are three triggers; each run
# checks the Melbourne time and does nothing if the list already exists or it's too early.
on:
  schedule:
    - cron: "7 10 * * 1" # 21:07 Melbourne during daylight saving (AEDT, Oct-Apr)
    - cron: "7 11 * * 1" # 21:07 Melbourne in winter (AEST, Apr-Oct)
    - cron: "37 12 * * 1" # backup in case GitHub drops one of the above
  workflow_dispatch:
    inputs:
      lesson_notes:
        description: "Lesson notes: paste the tutor chat as-is (optional)"
        required: false
      n:
        description: "Number of words (blank = config default)"
        required: false
      topics:
        description: "Comma-separated topics (blank = config default)"
        required: false
      force:
        description: "Replace this week's list if it already exists"
        type: boolean
        default: false

concurrency:
  group: data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      generated: ${{ steps.weekly.outputs.generated }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - name: Generate list, audio, release and feed
        id: weekly
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API }}
          WRITING_PASSWORD: ${{ secrets.WRITING_TAB }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ inputs.n }}
          TOPICS: ${{ inputs.topics }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          # Read the lesson notes from the event payload rather than an env var, so they
          # aren't echoed into the (public) log.
          mkdir -p build
          jq -r '.inputs.lesson_notes // ""' "$GITHUB_EVENT_PATH" > build/lesson.txt
          args=()
          if [ -s build/lesson.txt ] && [ -n "$(tr -d '[:space:]' < build/lesson.txt)" ]; then
            args+=(--lesson-file build/lesson.txt)
          fi
          if [ "$EVENT" = "schedule" ]; then args+=(--scheduled); fi
          if [ -n "$N" ]; then args+=(--n "$N"); fi
          if [ -n "$TOPICS" ]; then args+=(--topics "$TOPICS"); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          uv run vocab weekly "${args[@]}"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Word list $(date -u +%G-W%V)"
          git pull --rebase
          git push

  deploy:
    needs: build
    if: ${{ needs.build.outputs.generated == 'true' }}
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  notify:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.generated == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Send notifications
        env:
          SMTP_USER: ${{ secrets.EMAIL }}
          SMTP_APP_PASSWORD: ${{ secrets.APP_PW }}
          EMAIL_TO: ${{ secrets.EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run vocab notify
