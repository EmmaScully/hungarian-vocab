[project]
name = "hungarian-vocab"
version = "0.1.0"
description = "Weekly English→Hungarian vocabulary generation, flashcards and audio practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "edge-tts>=7.2.8",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
vocab = "vocab.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vocab"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
